<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> 매일 기도 챌린지 🙏</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, collection, query, orderBy, limit, onSnapshot, addDoc, serverTimestamp } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // 연동된 Firebase 설정
    const firebaseConfig = {
      apiKey: "AIzaSyA7O42ev9D6H8PzLMO6qzR1PeSHXM3JDI8",
      authDomain: "math-lover-d4916.firebaseapp.com",
      projectId: "math-lover-d4916",
      storageBucket: "math-lover-d4916.firebasestorage.app",
      messagingSenderId: "343871778182",
      appId: "1:343871778182:web:a69711224013c9c454d007"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // 💡 관리자 비밀번호 (원하는 비밀번호로 변경하세요!)
    const ADMIN_PASSWORD = "0309";

    // 1. 관리자가 올린 '오늘의 말씀/기도제목' 실시간 불러오기
    onSnapshot(doc(db, "settings", "todayPrayer"), (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        if (data.imageUrl) {
          document.getElementById("officialPrayerImg").src = data.imageUrl;
          document.getElementById("officialPrayerArea").classList.remove("hidden");
        }
      }
    });

    // 💡 관리자 패널 접기/펴기
    window.toggleAdminPanel = function() {
      const panel = document.getElementById("adminPanel");
      panel.classList.toggle("hidden");
    };

    // 💡 [관리자 전용] 오늘의 이미지 등록하기
    window.saveTodayPrayerImage = async function() {
      const inputPw = document.getElementById("adminPw").value.trim();
      const imageFile = document.getElementById("adminPrayerImgFile").files[0];
      const statusDiv = document.getElementById("adminStatus");

      if (inputPw !== ADMIN_PASSWORD) {
        alert("비밀번호가 일치하지 않습니다!");
        return;
      }
      if (!imageFile) {
        alert("등록할 이미지를 선택해주세요!");
        return;
      }

      statusDiv.innerHTML = "<p class='text-blue-600 font-bold'>⏳ 이미지를 업로드하는 중입니다...</p>";

      try {
        const pRef = ref(storage, `settings/todayPrayerImg_${Date.now()}`);
        await uploadBytes(pRef, imageFile);
        const imageUrl = await getDownloadURL(pRef);

        await setDoc(doc(db, "settings", "todayPrayer"), {
          imageUrl: imageUrl,
          updatedAt: new Date().toISOString()
        });

        statusDiv.innerHTML = "<p class='text-green-600 font-bold'>✅ 오늘의 이미지가 성공적으로 변경되었습니다!</p>";
        document.getElementById("adminPrayerImgFile").value = "";
      } catch (error) {
        console.error(error);
        statusDiv.innerHTML = "<p class='text-red-500 font-bold'>❌ 저장 중 오류가 발생했습니다.</p>";
      }
    };

    // 2. 기도 기록 제출 (제출 시 횟수 1회 증가)
    window.submitPrayer = async function() {
      const name = document.getElementById("userName").value.trim();
      const memo = document.getElementById("prayerMemo").value.trim();
      const imageFile = document.getElementById("prayerImage").files[0];
      const resultDiv = document.getElementById("resultMessage");
      const submitBtn = document.getElementById("submitBtn");

      if (!name) {
        alert("이름을 입력해주세요!");
        return;
      }

      submitBtn.innerText = "기도 인증 저장 중... ⏳";
      submitBtn.disabled = true;
      submitBtn.classList.add("opacity-50");

      try {
        let uploadedImageUrl = null;

        // 이미지 파일이 있는 경우 Firebase Storage 업로드 (추가 점수 없음)
        if (imageFile) {
          const imageRef = ref(storage, `church_prayers/${Date.now()}_${name}`);
          await uploadBytes(imageRef, imageFile);
          uploadedImageUrl = await getDownloadURL(imageRef);
        }

        // A. 개인 누적 기도 횟수 업데이트 (랭킹용)
        const userRef = doc(db, "church_rankings", name);
        const userSnap = await getDoc(userRef);

        let currentCount = 0;
        if (userSnap.exists()) {
          currentCount = userSnap.data().prayerCount || 0;
        }

        const newCount = currentCount + 1; // 제출할 때마다 1회씩 증가

        await setDoc(userRef, {
          name: name,
          prayerCount: newCount,
          lastUpdated: serverTimestamp()
        }, { merge: true });

        // B. 공유 피드 기록 추가 (다같이 보는 기도일지)
        await addDoc(collection(db, "church_posts"), {
          name: name,
          memo: memo || "다같이 아니모! 🙏",
          imageUrl: uploadedImageUrl,
          createdAt: serverTimestamp()
        });

        resultDiv.innerHTML = `<p class='text-emerald-600 font-bold bg-emerald-50 p-3 rounded-lg text-center'>
          🎉 기도 인증 완료! (총 누적 횟수: ${newCount}회)
        </p>`;

        // 입력창 초기화
        document.getElementById("prayerMemo").value = "";
        document.getElementById("prayerImage").value = "";

      } catch (error) {
        console.error(error);
        resultDiv.innerHTML = "<p class='text-red-500 font-bold bg-red-50 p-3 rounded-lg text-center'>저장 중 오류가 발생했습니다.</p>";
      } finally {
        submitBtn.innerText = "기도 인증하고 횟수 올리기 🙏";
        submitBtn.disabled = false;
        submitBtn.classList.remove("opacity-50");
      }
    };

    // 3. 실시간 기도 랭킹 불러오기 (기도 횟수 기준)
    const rankingQuery = query(collection(db, "church_rankings"), orderBy("prayerCount", "desc"), limit(10));
    onSnapshot(rankingQuery, (snapshot) => {
      const leaderboard = document.getElementById("leaderboard");
      leaderboard.innerHTML = "";
      
      let rank = 1;
      snapshot.forEach((doc) => {
        const data = doc.data();
        const row = `
          <tr class="border-b hover:bg-emerald-50/50 transition-colors">
            <td class="p-3 font-bold ${rank === 1 ? 'text-amber-500' : 'text-slate-600'}">${rank}위</td>
            <td class="p-3 font-semibold text-slate-800">${data.name}</td>
            <td class="p-3 font-bold text-emerald-600">${data.prayerCount}회</td>
          </tr>
        `;
        leaderboard.innerHTML += row;
        rank++;
      });

      if (snapshot.empty) {
        leaderboard.innerHTML = "<tr><td colspan='3' class='p-6 text-center text-slate-400'>첫 번째 기도를 등록해 보세요!</td></tr>";
      }
    });

    // 4. 실시간 기도 피드/갤러리 불러오기
    const feedQuery = query(collection(db, "church_posts"), orderBy("createdAt", "desc"), limit(12));
    onSnapshot(feedQuery, (snapshot) => {
      const feed = document.getElementById("prayerFeed");
      feed.innerHTML = "";

      snapshot.forEach((doc) => {
        const data = doc.data();
        const card = `
          <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-center mb-2">
                <span class="font-bold text-slate-800 text-sm">👤 ${data.name}</span>
                <span class="text-xs bg-emerald-100 text-emerald-700 font-bold px-2 py-0.5 rounded-full">🙏 인증 완료</span>
              </div>
              ${data.imageUrl ? `<img src="${data.imageUrl}" alt="기도 인증 사진" class="w-full h-48 object-cover rounded-lg mb-3 border border-slate-100 cursor-pointer" onclick="window.open('${data.imageUrl}')">` : ''}
              <p class="text-slate-600 text-xs leading-relaxed bg-slate-50 p-2.5 rounded-lg border border-slate-100">${data.memo}</p>
            </div>
          </div>
        `;
        feed.innerHTML += card;
      });

      if (snapshot.empty) {
        feed.innerHTML = "<p class='col-span-full text-center text-slate-400 py-8'>아직 올려진 기도 나눔이 없습니다.</p>";
      }
    });
  </script>
</head>
<body class="bg-emerald-50/40 min-h-screen p-4 md:p-8 font-sans pb-24">
  <header class="max-w-5xl mx-auto mb-8 text-center">
    <h1 class="text-3xl font-extrabold text-slate-800">교회 매일 기도 챌린지 🙏</h1>
    <p class="text-xs text-slate-500 mt-2">기도로 마음을 모으고 함께 기쁨을 나눠요!</p>
  </header>

  <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
    
    <!-- 1열: 상단 이미지 & 기도 제출 폼 -->
    <div class="flex flex-col gap-6 md:col-span-1 h-fit">
      
      <!-- 관리자가 올리는 오늘의 말씀/기도제목 (기본 숨김) -->
      <div id="officialPrayerArea" class="bg-white rounded-2xl p-4 shadow-md border border-emerald-200 hidden">
        <span class="bg-emerald-100 text-emerald-700 font-bold px-3 py-1 rounded-full text-xs mb-3 inline-block">✨ 오늘의 말씀 </span>
        <img id="officialPrayerImg" src="" alt="오늘의 기도제목" class="w-full h-auto rounded-lg shadow-sm border border-slate-100">
      </div>

      <!-- 기도 인증 폼 -->
      <div class="bg-white rounded-2xl p-6 shadow-md border border-slate-200">
        <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-1.5">
          <span>✍️</span> 오늘 기도 인증하기
        </h2>
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">이름</label>
            <input type="text" id="userName" placeholder="예: 이예준" class="w-full p-2.5 bg-slate-50 border rounded-lg text-sm focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">시온의 향기 (선택)</label>
            <textarea id="prayerMemo" placeholder="시온의 향기를 나눠주세요." class="w-full p-2.5 bg-slate-50 border rounded-lg text-sm h-20 resize-none focus:outline-none focus:border-emerald-500"></textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">📸 인증 사진 첨부 (선택)</label>
            <input type="file" id="prayerImage" accept="image/*" class="w-full text-slate-500 text-xs file:mr-3 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
          </div>
          <button id="submitBtn" onclick="submitPrayer()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-3 rounded-lg text-sm transition-all shadow-sm">
            기도 인증하고 횟수 올리기 🙏
          </button>
          <div id="resultMessage" class="text-xs mt-2"></div>
        </div>
      </div>
    </div>

    <!-- 2열 & 3열: 랭킹 및 피드 -->
    <div class="md:col-span-2 flex flex-col gap-6">
      
      <!-- 누적 기도 랭킹 -->
      <div class="bg-white rounded-2xl p-6 shadow-md border border-slate-200">
        <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-1.5">
          <span>🏆</span> 명예의 전당 (기도 횟수 랭킹)
        </h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-50 text-slate-500 border-b text-xs">
              <tr>
                <th class="p-2.5">순위</th>
                <th class="p-2.5">이름</th>
                <th class="p-2.5">누적 인증 횟수</th>
              </tr>
            </thead>
            <tbody id="leaderboard">
              <tr><td colspan="3" class="p-6 text-center text-slate-400">불러오는 중...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 다같이 보는 실시간 기도 피드 -->
      <div>
        <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
          <span>📖</span> 오늘의 시온의 향기
        </h2>
        <div id="prayerFeed" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <p class="col-span-full text-center text-slate-400 py-8">불러오는 중...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ⚙️ 관리자 전용 메뉴 (화면 맨 아래) -->
  <footer class="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-200 text-center">
    <button onclick="toggleAdminPanel()" class="text-xs text-slate-400 hover:text-slate-600 underline cursor-pointer">
      ⚙️ 관리자 전용 메뉴 열기/접기
    </button>
    <div id="adminPanel" class="hidden mt-4 p-6 bg-slate-800 text-white rounded-2xl text-left shadow-xl max-w-lg mx-auto">
      <h3 class="text-base font-bold mb-4 flex items-center gap-2">🔑 오늘의 말씀/기도제목 이미지 등록 (관리자)</h3>
      <div class="space-y-4 text-xs">
        <div>
          <label class="block font-semibold mb-1 text-slate-300">관리자 비밀번호</label>
          <input type="password" id="adminPw" placeholder="비밀번호 입력 (기본: 1234)" class="w-full p-2.5 bg-slate-700 text-white rounded border border-slate-600 focus:outline-none focus:border-emerald-400">
        </div>
        <div>
          <label class="block font-semibold mb-1 text-slate-300">맨 위에 표시될 이미지 선택</label>
          <input type="file" id="adminPrayerImgFile" accept="image/*" class="w-full text-slate-300 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:bg-slate-600 file:text-white hover:file:bg-slate-500">
        </div>
        <button onclick="saveTodayPrayerImage()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 rounded transition-all mt-2">
          이미지 등록하기 🚀
        </button>
        <div id="adminStatus" class="mt-2 text-center text-xs"></div>
      </div>
    </div>
  </footer>
</body>
</html>
